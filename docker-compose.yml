# docker-compose.yml — generated by Spryntworks Platform kit generator
# Edit .env to change settings, then run ./install.sh (or docker compose up -d)
services:
  openwebui:
    image: ghcr.io/shraddhanandkhot/open-webui:v0.11.1-custom
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-8080}:8080"
    volumes:
      - ./data:/app/backend/data
    environment:
      - OPENWEBUI_PORT=${OPENWEBUI_PORT:-8080}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API:-true}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
